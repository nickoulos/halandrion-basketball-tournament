<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Όμιλοι & Νοκ άουτ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Alegreya+Sans:wght@400;500;700;800&family=Bangers&family=Sofia+Sans+Extra+Condensed:wght@700..1000&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12100E; --surface:#1C1916; --surface-2:#26221E;
    --text:#EDE6DA; --muted:#9A8F80; --line:rgba(237,230,218,.14);
    --accent:#C4562E; --accent-text:#E0784C; --hi:#F0A02B;
    --ok:#4FAE77; --ink:#000; --on-accent:#FFFFFF;
    --head:'Sofia Sans Extra Condensed','Oswald',sans-serif;
    --label:'Oswald','Sofia Sans Extra Condensed',sans-serif;
  }
  html[lang=en]{--head:'Bangers','Oswald',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Alegreya Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;min-height:100vh}
  a{color:var(--accent-text);text-decoration:none}
  a:hover{color:var(--hi)}
  button{font-family:inherit}
  @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 90% at 82% -10%,rgba(240,160,43,.10),transparent 55%),radial-gradient(110% 80% at -10% 100%,rgba(196,86,46,.08),transparent 60%)}

  /* header */
  .site-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 26px;background:rgba(18,16,14,.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(237,230,218,.12)}
  .brand{display:flex;align-items:center;gap:12px;color:var(--text)}
  .brand:hover{color:var(--text)}
  .brand-mark{width:40px;height:40px;border-radius:9px;border:3px solid var(--ink);position:relative;box-shadow:0 3px 0 var(--ink);flex:none;overflow:hidden;background:var(--surface)}
  .brand-mark img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) saturate(1.1) contrast(1.05) brightness(.88)}
  .brand-mark::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(240,160,43,.12),rgba(18,16,14,.55))}
  .brand-name{font:900 15px/1 var(--head);letter-spacing:.04em}
  html[lang=en] .brand-name{font-weight:400}
  .brand-sub{font:500 11px/1.3 'Alegreya Sans',sans-serif;color:var(--muted);margin-top:3px}
  .header-actions{display:flex;align-items:center;gap:10px}
  .pill{background:transparent;border:2px solid rgba(237,230,218,.25);border-radius:999px;padding:7px 13px;font:600 12px var(--label);letter-spacing:.06em;color:var(--text);cursor:pointer}
  .pill:hover{background:rgba(237,230,218,.08);color:var(--text)}

  main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 22px 40px}

  /* title block */
  .intro{padding:44px 0 22px;animation:rise .5s ease both}
  .eyebrow{font:600 11px var(--label);letter-spacing:.2em;color:var(--accent-text)}
  h1{font:1000 clamp(40px,6vw,72px)/.92 var(--head);margin:10px 0 0;letter-spacing:-.005em}
  html[lang=en] h1{font-weight:400;letter-spacing:.02em}
  h1 span{color:var(--hi)}
  .intro p{font:400 18px/1.5 'Alegreya Sans',sans-serif;color:var(--muted);max-width:34em;margin:14px 0 0;text-wrap:pretty}

  /* tabs */
  .tabs{display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:var(--surface);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);margin:6px 0 30px}
  .tab{border:none;border-radius:999px;padding:11px 22px;font:700 15px var(--label);letter-spacing:.06em;color:var(--muted);background:transparent;cursor:pointer;transition:background .15s,color .15s}
  .tab:hover{color:var(--text)}
  .tab[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
  .tab:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  [role=tabpanel][hidden]{display:none}

  /* group cards */
  .groups{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{border-radius:18px;overflow:hidden;border:2px solid var(--ink);background:var(--surface);box-shadow:0 8px 0 var(--ink);animation:rise .45s ease both}
  .card-stripe{height:9px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,var(--ink) 18px 36px)}
  .card-head{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 20px 10px}
  .card-head .label{font:600 11px var(--label);letter-spacing:.18em;color:var(--accent-text)}
  .card-head .letter{font:1000 64px/.8 var(--head);color:var(--hi)}
  html[lang=en] .card-head .letter{font-weight:400}

  table{width:100%;border-collapse:collapse}
  .standings th{font:600 10px var(--label);letter-spacing:.14em;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:2px solid var(--line)}
  .standings th:first-child,.standings th:nth-child(2){text-align:left}
  .standings td{padding:10px 8px;border-bottom:1px solid var(--line);font:500 15px var(--label);text-align:right;font-variant-numeric:tabular-nums}
  .standings td.pos{width:28px;text-align:left;color:var(--muted);font-weight:700}
  .standings td.team{text-align:left;font:800 20px/1.05 var(--head);letter-spacing:.01em}
  html[lang=en] .standings td.team{font-weight:900}
  .standings tr.q td.pos{color:var(--ok)}
  .standings tr.q3 td.pos{color:var(--hi)}
  .standings tr:last-child td{border-bottom:none}
  .standings .pd-pos{color:var(--ok)}
  .standings .pd-neg{color:var(--accent-text)}
  .standings-wrap{padding:0 12px}

  .fixtures{margin-top:8px;padding:14px 20px 18px;background:rgba(0,0,0,.18);border-top:2px dashed rgba(237,230,218,.16)}
  .round{font:600 10px var(--label);letter-spacing:.18em;color:var(--muted);margin:12px 0 6px}
  .round:first-child{margin-top:0}
  .fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 0;font:600 15px/1.15 'Alegreya Sans',sans-serif}
  .fx .h{text-align:right}
  .fx .s{min-width:62px;text-align:center;font:700 13px var(--label);letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
  .fx .s.done{color:var(--text)}
  .fx .w{color:var(--text)}
  .fx .l{color:var(--muted)}
  .fx-meta{grid-column:1/-1;text-align:center;font:500 11px var(--label);letter-spacing:.08em;color:var(--muted);margin-top:-2px}

  .legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:28px;font:400 15px/1.45 'Alegreya Sans',sans-serif;color:var(--muted)}
  .legend b{font-weight:700;color:var(--text)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

  /* knockout */
  .bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:0 34px;align-items:stretch}
  .col{display:flex;flex-direction:column}
  .col-title{font:600 11px var(--label);letter-spacing:.2em;color:var(--accent-text);margin-bottom:14px}
  .col-body{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:18px}
  .tie{position:relative;border-radius:14px;border:2px solid var(--ink);background:var(--surface);box-shadow:0 6px 0 var(--ink);animation:rise .45s ease both}
  .tie-id{position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 7px;font:600 10px var(--label);letter-spacing:.16em;color:var(--muted)}
  .slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;min-height:52px}
  .slot + .slot{border-top:1px solid var(--line)}
  .slot .nm{font:800 19px/1.05 var(--head);letter-spacing:.01em}
  html[lang=en] .slot .nm{font-weight:900}
  .slot .nm.tbd{font:500 14px/1.25 'Alegreya Sans',sans-serif;color:var(--muted);letter-spacing:0}
  .slot .sc{font:700 18px var(--label);font-variant-numeric:tabular-nums;color:var(--muted)}
  .slot.win .sc{color:var(--hi)}
  .slot.lose .nm{color:var(--muted)}
  .final .tie{border-color:var(--hi);box-shadow:0 6px 0 var(--ink),0 0 0 4px rgba(240,160,43,.18)}
  .trophy{text-align:center;font:1000 clamp(30px,3.6vw,44px)/.95 var(--head);color:rgba(237,230,218,.1);margin-top:18px}
  html[lang=en] .trophy{font-weight:400}

  .ko-notes{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:40px}
  .note{border-radius:18px;border:2px solid var(--ink);background:var(--surface);box-shadow:0 8px 0 var(--ink);padding:22px 22px 18px}
  .note h3{font:900 26px/1 var(--head);margin:0 0 12px;letter-spacing:.01em}
  html[lang=en] .note h3{font-weight:400;letter-spacing:.03em}
  .note ol,.note ul{margin:0;padding-left:20px;font:400 16px/1.55 'Alegreya Sans',sans-serif;color:var(--muted)}
  .note li{margin:3px 0}
  .note li b{color:var(--text);font-weight:700}
  .thirds td.team{font:800 19px/1.05 var(--head)}
  .thirds tr.q td.pos{color:var(--hi)}
  .thirds td.team.tbd{font:500 15px 'Alegreya Sans',sans-serif;color:var(--muted)}

  footer{max-width:1120px;margin:0 auto;padding:14px 22px 40px;border-top:2px solid rgba(237,230,218,.12);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:400 14px 'Alegreya Sans',sans-serif;color:var(--muted);position:relative;z-index:1}

  @media (max-width:960px){
    .groups{grid-template-columns:1fr 1fr}
    .ko-notes{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .bracket{grid-template-columns:1fr;gap:30px}
    .col-body{gap:22px}
    .trophy{display:none}
  }
  @media (max-width:640px){
    .site-header{padding:11px 16px;gap:8px}
    .brand-sub{display:none}
    main{padding:0 16px 32px}
    footer{padding:14px 16px 32px}
    .groups{grid-template-columns:1fr}
    .tabs{display:flex}
    .tab{flex:1;padding:11px 10px}
  }
</style>
</head>
<body>
<div class="glow"></div>

<header class="site-header">
  <a class="brand" href="./">
    <div class="brand-mark"><img src="assets/heritage.jpg" alt=""></div>
    <div style="line-height:1">
      <div class="brand-name" data-t="brand" data-caps></div>
      <div class="brand-sub" data-t="brandSub"></div>
    </div>
  </a>
  <div class="header-actions">
    <button class="pill" id="lang-btn" type="button"></button>
    <a class="pill" href="./" data-t="home" data-caps></a>
  </div>
</header>

<main>
  <section class="intro">
    <div class="eyebrow" data-t="eyebrow" data-caps></div>
    <h1><span data-t="title1" data-caps></span><br><span data-t="title2" data-caps></span></h1>
    <p data-t="intro"></p>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-groups" aria-controls="panel-groups" data-tab="groups" data-t="tabGroups" data-caps></button>
    <button class="tab" role="tab" id="tab-knockout" aria-controls="panel-knockout" data-tab="knockout" data-t="tabKnockout" data-caps></button>
  </div>

  <section role="tabpanel" id="panel-groups" aria-labelledby="tab-groups">
    <div class="groups" id="groups"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--ok)"></span><span data-t="legendTop2"></span></span>
      <span><span class="dot" style="background:var(--hi)"></span><span data-t="legendThird"></span></span>
      <span data-t="legendTie"></span>
    </div>
  </section>

  <section role="tabpanel" id="panel-knockout" aria-labelledby="tab-knockout" hidden>
    <div class="bracket" id="bracket"></div>
    <div class="ko-notes">
      <div class="note">
        <h3 data-t="howTitle"></h3>
        <ol id="how"></ol>
      </div>
      <div class="note">
        <h3 data-t="thirdsTitle"></h3>
        <table class="standings thirds" id="thirds"></table>
      </div>
    </div>
  </section>
</main>

<footer>
  <span data-t="brandSub"></span>
  <span data-t="footerNote"></span>
</footer>

<script>
/* ════════════════════════════════════════════════════════════
   TOURNAMENT DATA — edit here, commit, push.
   Scores: set `score: [home, away]` on a match, e.g. score: [21, 17].
   Standings, best thirds and the knockout bracket fill in automatically.
   Optional `time: '18:30'` and `court: '1'` show under a fixture.
   ════════════════════════════════════════════════════════════ */
const GROUPS = {
  A: ['Τρεις και ο κούκλος', 'Αντί Συναφήν', 'Greek Russian', 'Santa'],
  B: ['Τα πουλέν', 'Συναφήν', 'Midrange Union', 'AJG'],
  C: ['Rawdoggers', 'Κουφάλες', 'Άσχετοι BC', 'The Jokers'],
};

// Round robin: every team plays the other three once (6 games per group, 18 total).
// Each round, every team plays exactly once.
const MATCHES = [
  // Round 1
  { id: 1,  round: 1, group: 'A', home: 'Τρεις και ο κούκλος', away: 'Santa',          score: null },
  { id: 2,  round: 1, group: 'B', home: 'Τα πουλέν',          away: 'AJG',            score: null },
  { id: 3,  round: 1, group: 'C', home: 'Rawdoggers',         away: 'The Jokers',     score: null },
  { id: 4,  round: 1, group: 'A', home: 'Αντί Συναφήν',       away: 'Greek Russian',  score: null },
  { id: 5,  round: 1, group: 'B', home: 'Συναφήν',            away: 'Midrange Union', score: null },
  { id: 6,  round: 1, group: 'C', home: 'Κουφάλες',           away: 'Άσχετοι BC',     score: null },
  // Round 2
  { id: 7,  round: 2, group: 'A', home: 'Τρεις και ο κούκλος', away: 'Greek Russian',  score: null },
  { id: 8,  round: 2, group: 'B', home: 'Τα πουλέν',          away: 'Midrange Union', score: null },
  { id: 9,  round: 2, group: 'C', home: 'Rawdoggers',         away: 'Άσχετοι BC',     score: null },
  { id: 10, round: 2, group: 'A', home: 'Santa',              away: 'Αντί Συναφήν',   score: null },
  { id: 11, round: 2, group: 'B', home: 'AJG',                away: 'Συναφήν',        score: null },
  { id: 12, round: 2, group: 'C', home: 'The Jokers',         away: 'Κουφάλες',       score: null },
  // Round 3
  { id: 13, round: 3, group: 'A', home: 'Τρεις και ο κούκλος', away: 'Αντί Συναφήν',   score: null },
  { id: 14, round: 3, group: 'B', home: 'Τα πουλέν',          away: 'Συναφήν',        score: null },
  { id: 15, round: 3, group: 'C', home: 'Rawdoggers',         away: 'Κουφάλες',       score: null },
  { id: 16, round: 3, group: 'A', home: 'Greek Russian',      away: 'Santa',          score: null },
  { id: 17, round: 3, group: 'B', home: 'Midrange Union',     away: 'AJG',            score: null },
  { id: 18, round: 3, group: 'C', home: 'Άσχετοι BC',         away: 'The Jokers',     score: null },
];

// Knockout scores, filled in as games finish. Teams are derived from the group stage.
const KNOCKOUT = {
  QF1: { score: null }, QF2: { score: null }, QF3: { score: null }, QF4: { score: null },
  SF1: { score: null }, SF2: { score: null },
  F:   { score: null },
};

/* ════════════════════════════════════════════════════════════ */

const STR = {
  gr: {
    brand: 'Κύπελλο Μπάσκετ Χαλανδρίου', brandSub: 'Σύνδεσμος Μικρασιατών Χαλανδρίου — Ρίζες',
    home: 'Αρχική', otherLang: 'EN',
    eyebrow: 'Κλήρωση · 3ον3', title1: 'Όμιλοι &', title2: 'Νοκ άουτ',
    intro: '12 ομάδες, 3 όμιλοι των 4. Περνούν οι δύο πρώτοι κάθε ομίλου και οι δύο καλύτεροι τρίτοι — 8 ομάδες στα προημιτελικά.',
    tabGroups: 'Όμιλοι', tabKnockout: 'Νοκ άουτ',
    group: 'Όμιλος', round: 'Γύρος',
    colTeam: 'Ομάδα', colP: 'Αγ', colW: 'Ν', colL: 'Η', colPD: '+/−',
    legendTop2: 'Οι 2 πρώτοι περνούν', legendThird: 'Ο 3ος διεκδικεί μία από τις 2 θέσεις καλύτερου τρίτου',
    legendTie: 'Κατάταξη: νίκες, μετά διαφορά πόντων, μετά πόντοι υπέρ.',
    qf: 'Προημιτελικά', sf: 'Ημιτελικά', final: 'Τελικός', champion: 'Πρωταθλητής',
    seed: ['Καλύτερος 1ος', '2ος καλύτερος 1ος', '3ος καλύτερος 1ος', 'Καλύτερος 2ος', '2ος καλύτερος 2ος', '3ος καλύτερος 2ος', 'Καλύτερος 3ος', '2ος καλύτερος 3ος'],
    winnerOf: id => 'Νικητής ' + id,
    court: 'Γήπεδο',
    howTitle: 'Πώς στήνεται το ταμπλό',
    how: [
      '<b>Οι 8 ομάδες κατατάσσονται</b> μετά τους ομίλους: πρώτα οι τρεις 1οι, μετά οι τρεις 2οι, μετά οι δύο καλύτεροι 3οι — μεταξύ τους με νίκες, διαφορά πόντων, πόντους υπέρ.',
      '<b>Προημιτελικά:</b> 1ος–8ος, 4ος–5ος, 2ος–7ος, 3ος–6ος. Δύο ομάδες του ίδιου ομίλου δεν ξανασυναντιούνται εδώ· αν χρειαστεί, αλλάζει μόνο ο αντίπαλος.',
      '<b>Ημιτελικά:</b> οι νικητές ΠΡ1–ΠΡ2 και ΠΡ3–ΠΡ4. Οι δύο καλύτεροι 1οι μπορούν να βρεθούν μόνο στον τελικό.',
      '<b>Τελικός</b> ανάμεσα στους δύο νικητές των ημιτελικών.',
    ],
    thirdsTitle: 'Μάχη των 3ων',
    thirdOf: g => '3ος Ομίλου ' + g,
    footerNote: 'Φτιαγμένο με αγάπη για τη γειτονιά',
    ids: { QF1: 'ΠΡ1', QF2: 'ΠΡ2', QF3: 'ΠΡ3', QF4: 'ΠΡ4', SF1: 'ΗΜ1', SF2: 'ΗΜ2', F: 'Τελικός' },
  },
  en: {
    brand: 'Chalandri Basketball Cup', brandSub: 'Asia Minor Refugees Assoc. of Chalandri — Roots',
    home: 'Home', otherLang: 'ΕΛ',
    eyebrow: 'The draw · 3on3', title1: 'Groups &', title2: 'Knockouts',
    intro: '12 teams, 3 groups of 4. The top two in each group plus the two best third-placed teams go through — 8 teams in the quarter-finals.',
    tabGroups: 'Groups', tabKnockout: 'Knockouts',
    group: 'Group', round: 'Round',
    colTeam: 'Team', colP: 'P', colW: 'W', colL: 'L', colPD: '+/−',
    legendTop2: 'Top 2 go through', legendThird: '3rd place fights for one of the 2 best-third spots',
    legendTie: 'Ranking: wins, then point difference, then points scored.',
    qf: 'Quarter-finals', sf: 'Semi-finals', final: 'Final', champion: 'Champion',
    seed: ['Best group winner', '2nd-best group winner', '3rd-best group winner', 'Best runner-up', '2nd-best runner-up', '3rd-best runner-up', 'Best 3rd place', '2nd-best 3rd place'],
    winnerOf: id => 'Winner ' + id,
    court: 'Court',
    howTitle: 'How the bracket is set',
    how: [
      '<b>The 8 qualifiers are seeded</b> after the groups: the three winners first, then the three runners-up, then the two best thirds — each tier ordered by wins, point difference, points scored.',
      '<b>Quarter-finals:</b> 1v8, 4v5, 2v7, 3v6. Teams from the same group can’t meet again here; if needed, only the opponent is swapped.',
      '<b>Semi-finals:</b> winners of QF1–QF2 and QF3–QF4. The two best group winners can only meet in the final.',
      '<b>Final</b> between the two semi-final winners.',
    ],
    thirdsTitle: 'Race of the thirds',
    thirdOf: g => 'Group ' + g + ' 3rd place',
    footerNote: 'Made with love for the neighbourhood',
    ids: { QF1: 'QF1', QF2: 'QF2', QF3: 'QF3', QF4: 'QF4', SF1: 'SF1', SF2: 'SF2', F: 'Final' },
  },
};

// Greek all-caps drops the tonos (ΌΜΙΛΟΙ → ΟΜΙΛΟΙ); CSS uppercase would keep it.
const caps = s => (s || '').toLocaleUpperCase('el').normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let lang = 'gr';
try { const q = new URLSearchParams(location.search).get('lang'); lang = q === 'en' || q === 'gr' ? q : (localStorage.getItem('hbt-lang') || 'gr'); } catch (e) {}
if (!STR[lang]) lang = 'gr';

/* ── standings ── */
const played = m => Array.isArray(m.score) && m.score.length === 2;

function table(group) {
  const rows = Object.fromEntries(GROUPS[group].map(t => [t, { team: t, group, p: 0, w: 0, l: 0, pf: 0, pa: 0 }]));
  for (const m of MATCHES) {
    if (m.group !== group || !played(m)) continue;
    const [hs, as] = m.score, h = rows[m.home], a = rows[m.away];
    h.p++; a.p++; h.pf += hs; h.pa += as; a.pf += as; a.pa += hs;
    if (hs > as) { h.w++; a.l++; } else if (as > hs) { a.w++; h.l++; }
  }
  return sortRows(Object.values(rows));
}

const sortRows = rows => rows.sort((x, y) =>
  (y.w - x.w) || ((y.pf - y.pa) - (x.pf - x.pa)) || (y.pf - x.pf) || GROUPS[x.group].indexOf(x.team) - GROUPS[y.group].indexOf(y.team));

const groupsDone = () => MATCHES.every(played);

/* ── knockout ── */
function seeds() {
  const tables = Object.keys(GROUPS).map(table);
  const tier = i => sortRows(tables.map(t => t[i]));
  const thirds = tier(2);
  return { list: [...tier(0), ...tier(1), ...thirds.slice(0, 2)], thirds };
}

// QF: 1v8, 4v5, 2v7, 3v6 — reassign 6/7/8 if that would pit two teams from the same group against each other.
function quarterPairs(s) {
  const perms = [[5, 6, 7], [5, 7, 6], [6, 5, 7], [6, 7, 5], [7, 5, 6], [7, 6, 5]];
  const ok = p => s[2].group !== s[p[0]].group && s[1].group !== s[p[1]].group && s[0].group !== s[p[2]].group;
  const p = perms.find(ok) || perms[0];
  return { QF1: [0, p[2]], QF2: [3, 4], QF3: [1, p[1]], QF4: [2, p[0]] };
}

function winner(id, teams) {
  const sc = KNOCKOUT[id] && KNOCKOUT[id].score;
  if (!teams[0] || !teams[1] || !Array.isArray(sc) || sc[0] === sc[1]) return null;
  return sc[0] > sc[1] ? teams[0] : teams[1];
}

function bracket() {
  const S = STR[lang], done = groupsDone(), sd = seeds();
  const qfIdx = done ? quarterPairs(sd.list) : { QF1: [0, 7], QF2: [3, 4], QF3: [1, 6], QF4: [2, 5] };
  const ties = {};
  for (const id of ['QF1', 'QF2', 'QF3', 'QF4']) {
    const [a, b] = qfIdx[id];
    ties[id] = {
      teams: done ? [sd.list[a].team, sd.list[b].team] : [null, null],
      labels: [S.seed[a], S.seed[b]],
    };
  }
  const feed = (id, from) => {
    const teams = from.map(f => winner(f, ties[f].teams));
    ties[id] = { teams, labels: from.map(f => S.winnerOf(S.ids[f])) };
  };
  feed('SF1', ['QF1', 'QF2']);
  feed('SF2', ['QF3', 'QF4']);
  feed('F', ['SF1', 'SF2']);
  return { ties, thirds: sd.thirds, done, champion: winner('F', ties.F.teams) };
}

/* ── render ── */
function renderStatic() {
  const S = STR[lang];
  document.documentElement.lang = lang === 'gr' ? 'el' : 'en';
  document.title = lang === 'gr' ? 'Όμιλοι & Νοκ άουτ' : 'Groups & Knockouts';
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = S[el.dataset.t];
    el.textContent = el.hasAttribute('data-caps') ? caps(v) : v;
  });
  document.getElementById('lang-btn').textContent = S.otherLang;
  document.getElementById('how').innerHTML = S.how.map(li => `<li>${li}</li>`).join('');
}

function renderGroups() {
  const S = STR[lang];
  const pd = n => n > 0 ? `<span class="pd-pos">+${n}</span>` : n < 0 ? `<span class="pd-neg">−${-n}</span>` : '0';
  document.getElementById('groups').innerHTML = Object.keys(GROUPS).map((g, gi) => {
    const started = MATCHES.some(m => m.group === g && played(m));
    const rows = table(g).map((r, i) => `
      <tr class="${!started ? '' : i < 2 ? 'q' : i === 2 ? 'q3' : ''}">
        <td class="pos">${i + 1}</td>
        <td class="team">${esc(r.team)}</td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${pd(r.pf - r.pa)}</td>
      </tr>`).join('');
    const rounds = [1, 2, 3].map(rd => {
      const fx = MATCHES.filter(m => m.group === g && m.round === rd).map(m => {
        const done = played(m), hw = done && m.score[0] > m.score[1], aw = done && m.score[1] > m.score[0];
        const meta = [m.time, m.court && `${S.court} ${m.court}`].filter(Boolean).join(' · ');
        return `<div class="fx">
          <span class="h ${done ? (hw ? 'w' : 'l') : ''}">${esc(m.home)}</span>
          <span class="s ${done ? 'done' : ''}">${done ? `${m.score[0]} – ${m.score[1]}` : 'vs'}</span>
          <span class="a ${done ? (aw ? 'w' : 'l') : ''}">${esc(m.away)}</span>
          ${meta ? `<span class="fx-meta">${esc(meta)}</span>` : ''}
        </div>`;
      }).join('');
      return `<div class="round">${caps(S.round)} ${rd}</div>${fx}`;
    }).join('');
    return `<article class="card" style="animation-delay:${gi * 70}ms">
      <div class="card-stripe"></div>
      <div class="card-head"><span class="label">${caps(S.group)}</span><span class="letter">${g}</span></div>
      <div class="standings-wrap"><table class="standings">
        <thead><tr><th>#</th><th>${caps(S.colTeam)}</th><th>${caps(S.colP)}</th><th>${caps(S.colW)}</th><th>${caps(S.colL)}</th><th>${S.colPD}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="fixtures">${rounds}</div>
    </article>`;
  }).join('');
}

function renderKnockout() {
  const S = STR[lang], { ties, thirds, champion } = bracket();
  const tie = (id, delay) => {
    const t = ties[id], sc = KNOCKOUT[id] && KNOCKOUT[id].score, has = Array.isArray(sc);
    const w = winner(id, t.teams);
    const slot = i => {
      const name = t.teams[i];
      const cls = w ? (w === name ? 'win' : 'lose') : '';
      return `<div class="slot ${cls}">
        <span class="nm ${name ? '' : 'tbd'}">${esc(name || t.labels[i])}</span>
        <span class="sc">${has && name ? sc[i] : ''}</span>
      </div>`;
    };
    return `<div class="tie" style="animation-delay:${delay}ms"><span class="tie-id">${esc(caps(S.ids[id]))}</span>${slot(0)}${slot(1)}</div>`;
  };
  document.getElementById('bracket').innerHTML = `
    <div class="col"><div class="col-title">${caps(S.qf)}</div><div class="col-body">${['QF1', 'QF2', 'QF3', 'QF4'].map((id, i) => tie(id, i * 60)).join('')}</div></div>
    <div class="col"><div class="col-title">${caps(S.sf)}</div><div class="col-body">${['SF1', 'SF2'].map((id, i) => tie(id, 240 + i * 60)).join('')}</div></div>
    <div class="col final"><div class="col-title">${caps(S.final)}</div><div class="col-body"><div>${tie('F', 380)}
      <div class="trophy">${champion ? esc(champion) : '🏆'}</div></div></div></div>`;

  const pd = n => n > 0 ? `<span class="pd-pos">+${n}</span>` : n < 0 ? `<span class="pd-neg">−${-n}</span>` : '0';
  document.getElementById('thirds').innerHTML = `
    <thead><tr><th>#</th><th>${caps(S.colTeam)}</th><th>${caps(S.group)}</th><th>${caps(S.colW)}</th><th>${S.colPD}</th></tr></thead>
    <tbody>${MATCHES.some(played) ? thirds.map((r, i) => `<tr class="${i < 2 ? 'q' : ''}">
      <td class="pos">${i + 1}</td><td class="team">${esc(r.team)}</td><td>${r.group}</td><td>${r.w}</td><td>${pd(r.pf - r.pa)}</td>
    </tr>`).join('') : Object.keys(GROUPS).map(g => `<tr>
      <td class="pos">–</td><td class="team tbd">${esc(S.thirdOf(g))}</td><td>${g}</td><td>0</td><td>0</td>
    </tr>`).join('')}</tbody>`;
}

/* ── tabs ── */
function selectTab(name, focus) {
  document.querySelectorAll('[role=tab]').forEach(tab => {
    const on = tab.dataset.tab === name;
    tab.setAttribute('aria-selected', on);
    tab.tabIndex = on ? 0 : -1;
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !on;
    if (on && focus) tab.focus();
  });
}
document.querySelectorAll('[role=tab]').forEach(tab => {
  tab.addEventListener('click', () => { selectTab(tab.dataset.tab); history.replaceState(null, '', '#' + tab.dataset.tab); });
  tab.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const next = tab.dataset.tab === 'groups' ? 'knockout' : 'groups';
    selectTab(next, true); history.replaceState(null, '', '#' + next);
  });
});

document.getElementById('lang-btn').addEventListener('click', () => {
  lang = lang === 'gr' ? 'en' : 'gr';
  try { localStorage.setItem('hbt-lang', lang); } catch (e) {}
  render();
});

function render() { renderStatic(); renderGroups(); renderKnockout(); }
render();
selectTab(location.hash === '#knockout' ? 'knockout' : 'groups');
</script>
</body>
</html>
